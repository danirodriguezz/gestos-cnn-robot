[project]
name = "gestos-cnn-robot"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=2.2.0",
    "matplotlib>=3.11.2",
    "mediapipe>=1.1.1",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pillow>=13.0.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
